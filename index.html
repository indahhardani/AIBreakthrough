  <!-- 3. SUPABASE INTEGRATION SCRIPT (FIXED) -->
  <!-- ========================================== -->
  <script>
    // MASUKKAN KREDENSIAL SUPABASE ANDA:
    const SUPABASE_URL = 'https://zsifocstbcbrxtexkuyi.supabase.co';
    const SUPABASE_ANON_KEY = 'https://zsifocstbcbrxtexkuyi.supabase.co';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    // Auto-fill tombol demo yang disesuaikan
    function fillDemo(username, password) {
      document.getElementById('username-input').value = username;
      document.getElementById('password-input').value = password;
    }

    // Login Sederhana mencocokkan Username & Password ke tabel 'public.users'
    async function handleSimpleLogin(e) {
      e.preventDefault();
      
      // Ambil input dan hilangkan spasi tidak sengaja
      const usernameInput = document.getElementById('username-input').value.trim();
      const passwordInput = document.getElementById('password-input').value.trim();
      const btnSubmit = document.getElementById('btn-submit');

      btnSubmit.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Memeriksa DB...`;
      lucide.createIcons();

      try {
        // Query dengan ilike (case-insensitive username) agar 'NPD' atau 'npd' tetap terdeteksi
        const { data: users, error } = await supabaseClient
          .from('users')
          .select('*')
          .ilike('username', usernameInput)
          .eq('password', passwordInput);

        if (error) {
          alert('Error Database: ' + error.message);
          btnSubmit.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i> Masuk ke Sistem`;
          lucide.createIcons();
          return;
        }

        if (users && users.length > 0) {
          const user = users[0];
          const sessionData = { 
            username: user.username, 
            role: user.role, 
            avatar: user.username.substring(0, 2).toUpperCase() 
          };
          localStorage.setItem('db_session', JSON.stringify(sessionData));
          showApp(sessionData);
        } else {
          alert('Username atau Password salah! Pastikan telah menjalankan script SQL perbaikan di Supabase.');
          btnSubmit.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i> Masuk ke Sistem`;
          lucide.createIcons();
        }
      } catch (err) {
        alert('Gagal terhubung ke Supabase: ' + err.message);
        btnSubmit.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i> Masuk ke Sistem`;
        lucide.createIcons();
      }
    }

    function handleLogout() {
      localStorage.removeItem('db_session');
      document.getElementById('login-view').classList.remove('hidden');
      document.getElementById('app-view').classList.add('hidden');
    }

    function showApp(session) {
      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('app-view').classList.remove('hidden');

      document.getElementById('user-display').innerText = session.username;
      document.getElementById('role-display').innerText = session.role;
      document.getElementById('user-avatar').innerText = session.avatar;
      document.getElementById('access-badge').innerText = session.role;
    }

    // Cek Session saat Halaman Dimuat
    document.addEventListener('DOMContentLoaded', () => {
      const savedSession = localStorage.getItem('db_session');
      if (savedSession) {
        showApp(JSON.parse(savedSession));
      }
    });
  </script>
